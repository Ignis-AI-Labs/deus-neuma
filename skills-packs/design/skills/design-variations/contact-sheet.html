<!DOCTYPE html>
<!--
  THE CONTACT SHEET — one page, every direction, judged side by side.
  The design-variations skill copies this file to designs/<slug>/index.html
  and fills the three marker spots: TITLE, the LEAD line, and one
  <section class="variant"> row per variant file sitting beside it.
  LINE & CYCLE register, self-contained, opens from file://.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DESIGN BENCH — {{SLUG}}</title>
<style>
  :root {
    --signal: #5FE9FF;
    --line: rgba(255, 255, 255, 0.18);
    --line-hover: rgba(255, 255, 255, 0.40);
    --color-void: #000000;
    --color-text-primary: rgba(255, 255, 255, 0.95);
    --color-text-secondary: rgba(255, 255, 255, 0.7);
    --color-text-tertiary: rgba(255, 255, 255, 0.5);
    --font-data: 'JetBrains Mono', 'Fira Code', monospace;
    --font-voice: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--color-void);
    color: var(--color-text-primary);
    font-family: var(--font-voice);
    padding: 32px 24px 64px;
  }
  header { margin-bottom: 24px; }
  .bench-label {
    font-family: var(--font-data);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--color-text-tertiary);
  }
  .bench-title {
    font-family: var(--font-data);
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--color-text-primary);
    margin-top: 6px;
  }
  .bench-lead {
    font-family: var(--font-data);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--color-text-secondary);
    margin-top: 10px;
    line-height: 1.7;
  }
  .variant {
    border: 1px solid var(--line);
    margin-top: 20px;
  }
  .variant-head {
    display: flex;
    align-items: baseline;
    gap: 16px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
  }
  .variant-num {
    font-family: var(--font-data);
    font-size: 12px;
    color: var(--signal);
    letter-spacing: 0.12em;
  }
  .variant-name {
    font-family: var(--font-data);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--color-text-primary);
  }
  .variant-direction {
    font-family: var(--font-data);
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--color-text-tertiary);
  }
  .variant iframe {
    display: block;
    width: 100%;
    height: 460px; /* tune per exercise so the whole piece is visible */
    border: 0;
    background: var(--color-void);
  }
  .variant-notes {
    padding: 8px 14px;
    border-top: 1px solid var(--line);
    font-family: var(--font-data);
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--color-text-tertiary);
    line-height: 1.7;
  }
  footer {
    margin-top: 28px;
    font-family: var(--font-data);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--color-text-tertiary);
  }
  footer .lock { color: var(--signal); }
</style>
</head>
<body>
  <header>
    <p class="bench-label">THE DESIGN BENCH — VARIATIONS BEFORE CODE</p>
    <h1 class="bench-title">{{SLUG}} — {{N}} DIRECTIONS</h1>
    <p class="bench-lead">{{LEAD — one line: what piece this is, and what the operator is judging}}</p>
  </header>

  <!-- One section per variant. Duplicate this block per direction:
  <section class="variant">
    <div class="variant-head">
      <span class="variant-num">01</span>
      <span class="variant-name">DIRECTION NAME</span>
      <span class="variant-direction">one sentence — how this direction differs</span>
    </div>
    <iframe src="variant-1.html" title="variant 1" loading="lazy"></iframe>
    <p class="variant-notes">NOTES — trade-offs, what to look at, EXPLORATION if it breaks the language on purpose</p>
  </section>
  -->

  <footer>
    RATIFICATION IS A WORD — NAME THE NUMBER AND IT LOCKS. <span class="lock">NOTHING SHIPS UNSEEN.</span>
  </footer>
</body>
</html>
