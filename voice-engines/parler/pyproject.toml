[project]
name = "parler-sidecar"
version = "0.1.0"
description = "Local HTTP sidecar for Parler TTS Mini — text-described voice design."
requires-python = ">=3.10,<3.13"
dependencies = [
    "parler_tts",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "torch>=2.4",
    "transformers>=4.46",
    "soundfile>=0.13",
    "numpy>=1.24",
    "accelerate>=0.34",
]

[tool.uv]
torch-backend = "cu121"
