<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="{{data.speaker}}: {{data.lineOne}} {{data.lineTwo}} {{data.lineThree}}">
  {{fontface}}
  <defs>
    <!-- ⚠️ THE ANNOUNCEMENT REGISTER, NOT MILESTONE'S. Design note, 2026-09-01: […]
         The first cut of this card borrowed milestone's chrome — a line grid, a
         vertical edge wash, a contained 420px mark at 0.05 — and it read as
         careful rather than confident. The four things that give `announcement`
         its weight are copied here as a SET, because they only work together:
         the dot grid, the diagonal corner wash, the half-cut mark, and the glow
         beneath the type. Taking the mask alone would have put a 1180px mark
         behind unprotected text. -->
    <linearGradient id="edge" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="{{token.accentGlow}}"/>
      <stop offset="42%" stop-color="{{token.bg}}" stop-opacity="0"/>
    </linearGradient>
    <!-- One blurred copy of the SAME glyphs beneath the sharp ones, so the
         light comes off the letterforms rather than from a shape drawn behind
         them. stdDeviation 14 at 0.5 opacity is the launch card's restraint,
         and it is what lets the quote sit OVER the mark and stay crisp. -->
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14"/>
    </filter>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="{{token.ink}}" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="{{token.bg}}"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#edge)" opacity="0.5"/>

  <!-- ⚠️ NO INNER HAIRLINE RECT. milestone draws one at 24 and reads as a
       double frame; announcement draws four corner marks and nothing else, and
       that is the card Founder pointed at. Four marks read as an instrument
       sighting on something; a closed box reads as a border and shrinks the
       card it is meant to hold. -->
  <g stroke="{{token.trim}}" stroke-width="2" opacity="0.5" fill="none">
    <path d="M40 64 V40 H64"/>
    <path d="M1536 40 H1560 V64"/>
    <path d="M1560 836 V860 H1536"/>
    <path d="M64 860 H40 V836"/>
  </g>

  <!-- THE MASK AS AN ICON, not a watermark — the identical half-cut
       `announcement` and `launch` carry. 1180px placed so the card's right edge
       falls on the mark's own horizontal CENTRE (1600 − 1180/2 = 1010), so
       exactly its left half is on the card. The viewBox clips, which makes the
       crop exact and free, and a mark the frame cuts reads as something the
       card was placed OVER. A fully visible mark can only read as a badge. -->
  <image href="{{mark.mask}}" x="1010" y="-140" width="1180" height="1180"
         preserveAspectRatio="xMidYMid meet" opacity="0.16"/>

  <!-- The spine. LINE & CYCLE owns no quotation glyph — the language is
       straight lines and hairlines (design-language.md:158-161), and a 200px
       curly comma is from a different design language. The house already has a
       mark for "one continuous thing": the spine (:224-226), […]. A quote is exactly that. -->
  <line x1="128" y1="252" x2="128" y2="556" stroke="{{token.trimHot}}" stroke-width="3" opacity="0.85"/>

  <text x="128" y="175" font-family="{{font.data}}" font-weight="{{font.labelWeight}}"
        font-size="46" letter-spacing="{{font.labelTrack}}"
        fill="{{token.trimHot}}">{{data.eyebrow}}</text>

  <!-- THREE EXPLICIT LINES, NOT A PARAGRAPH. SVG `<text>` does not wrap, and a
       pull quote's line breaks are a typographic decision — handing them to a
       wrapper would let a renderer orphan the last word of somebody's sentence.
       76px on the VOICE face: `design-language.md:243` gives Inter to […]. A quote in the display face would read as a
       headline the house wrote, which is the one thing it must not be.
       Each line is drawn TWICE — blurred beneath, sharp on top — so it holds
       its edge where it crosses the mark. -->
  <g font-family="{{font.voice}}" font-weight="{{font.voiceWeight}}" font-size="76"
     fill="{{token.ink}}">
    <g opacity="0.5" filter="url(#softGlow)">
      <text x="184" y="326">{{data.lineOne}}</text>
      <text x="184" y="422">{{data.lineTwo}}</text>
      <text x="184" y="518">{{data.lineThree}}</text>
    </g>
    <text x="184" y="326">{{data.lineOne}}</text>
    <text x="184" y="422">{{data.lineTwo}}</text>
    <text x="184" y="518">{{data.lineThree}}</text>
  </g>

  <!-- The attribution, in the DATA register — a name is a fact ABOUT the quote,
       not part of the utterance. Two tiers so the eye reads the person first. -->
  <text x="184" y="626" font-family="{{font.data}}" font-weight="{{font.labelWeight}}"
        font-size="38" letter-spacing="{{font.labelTrack}}"
        fill="{{token.inkSoft}}">{{data.speaker}}</text>
  <!-- 34, not 30. 30 is the one tier this family keeps below the comfortable
       line (7.3 CSS px in a phone feed), and `stat`'s three column captions are
       pinned by name as its only occupants. A job title is not a reason to open
       that door. -->
  <text x="184" y="674" font-family="{{font.data}}" font-weight="{{font.labelWeight}}"
        font-size="34" letter-spacing="{{font.labelTrack}}"
        fill="{{token.muted}}">{{data.role}}</text>

  <!-- ⚠️ NO `asOf`. A timestamp is the provenance of a MEASUREMENT. A quote is
       not measured, and a stamp on one would read as a claim about when it was
       true. The handle signs it. -->
  <line x1="128" y1="757" x2="1472" y2="757" stroke="{{token.hairline}}" stroke-width="1"/>
  <image href="{{mark.wordmark}}" x="128" y="775" width="400" height="54"
         preserveAspectRatio="xMinYMid meet"/>
  <text x="1472" y="814" text-anchor="end" font-family="{{font.data}}"
        font-weight="{{font.labelWeight}}" font-size="34"
        letter-spacing="{{font.labelTrack}}" fill="{{token.gray}}">{{brand.handle}}</text>
</svg>
