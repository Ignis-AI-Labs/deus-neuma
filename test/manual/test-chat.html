<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuma Chat & MCP Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            color: #fff;
            font-family: 'Inter', monospace;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 24px;
            font-weight: 200;
            letter-spacing: 0.05em;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .test-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .test-section {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
        }
        
        .test-section h2 {
            font-size: 14px;
            font-weight: 400;
            margin-bottom: 15px;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        
        #status {
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #333;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff0000;
            transition: all 0.3s ease;
        }
        
        .status-indicator.connected {
            background: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }
        
        #messages {
            height: 400px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.5);
        }
        
        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 6px;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .user {
            color: #00ffff;
            background: rgba(0, 255, 255, 0.05);
            border-left: 3px solid #00ffff;
        }
        
        .companion {
            color: #ff00ff;
            background: rgba(255, 0, 255, 0.05);
            border-left: 3px solid #ff00ff;
        }
        
        .system {
            color: #ffff00;
            background: rgba(255, 255, 0, 0.05);
            border-left: 3px solid #ffff00;
            font-size: 12px;
        }
        
        .tool-call {
            color: #00ff88;
            background: rgba(0, 255, 136, 0.05);
            border-left: 3px solid #00ff88;
            font-family: monospace;
            font-size: 12px;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        input {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        input:focus {
            outline: none;
            border-color: #00ffff;
            background: rgba(0, 255, 255, 0.05);
        }
        
        button {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.95);
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
        }
        
        .test-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }
        
        .test-button {
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            text-align: left;
            font-size: 13px;
        }
        
        .test-button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        
        .stat {
            text-align: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 6px;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 200;
            color: #00ffff;
        }
        
        .stat-label {
            font-size: 11px;
            opacity: 0.5;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔬 Neuma Chat & MCP Test Suite</h1>
        
        <div id="status">
            <span class="status-indicator" id="status-indicator"></span>
            <span id="status-text">Disconnected</span>
        </div>
        
        <div class="test-grid">
            <div class="test-section">
                <h2>Chat Tests</h2>
                <div class="test-buttons">
                    <button class="test-button" onclick="testSimpleChat()">Simple Message</button>
                    <button class="test-button" onclick="testEmotionalChat()">Emotional Response</button>
                    <button class="test-button" onclick="testMemoryChat()">Memory Query</button>
                    <button class="test-button" onclick="testStreamingChat()">Streaming Test</button>
                </div>
            </div>
            
            <div class="test-section">
                <h2>MCP Tool Tests</h2>
                <div class="test-buttons">
                    <button class="test-button" onclick="testMCPList()">List Files (MCP)</button>
                    <button class="test-button" onclick="testMCPRead()">Read File (MCP)</button>
                    <button class="test-button" onclick="testMCPWrite()">Write File (MCP)</button>
                    <button class="test-button" onclick="testMCPSearch()">Search Files (MCP)</button>
                </div>
            </div>
        </div>
        
        <div id="messages"></div>
        
        <div class="input-group">
            <input type="text" id="input" placeholder="Type a message to test chat...">
            <button onclick="sendMessage()">Send Message</button>
            <button onclick="clearMessages()">Clear</button>
        </div>
        
        <div class="test-section">
            <h2>Connection Stats</h2>
            <div class="stats">
                <div class="stat">
                    <div class="stat-value" id="msg-count">0</div>
                    <div class="stat-label">Messages</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="tool-count">0</div>
                    <div class="stat-label">Tool Calls</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="latency">0ms</div>
                    <div class="stat-label">Latency</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let messageCount = 0;
        let toolCallCount = 0;
        let lastMessageTime = Date.now();
        
        const statusIndicator = document.getElementById('status-indicator');
        const statusText = document.getElementById('status-text');
        const messages = document.getElementById('messages');
        const input = document.getElementById('input');
        const msgCountEl = document.getElementById('msg-count');
        const toolCountEl = document.getElementById('tool-count');
        const latencyEl = document.getElementById('latency');

        // Set test companion
        localStorage.setItem('neuma-companion', 'TestCompanion');

        function connect() {
            ws = new WebSocket('ws://localhost:3333/ws');
            
            ws.onopen = () => {
                statusText.textContent = 'Connected to Portal';
                statusIndicator.classList.add('connected');
                addMessage('system', '✨ Portal connection established');
                
                // Manifest companion
                ws.send(JSON.stringify({
                    type: 'companion:manifest',
                    companion: 'TestCompanion'
                }));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                console.log('Received:', data);
                
                // Calculate latency
                const latency = Date.now() - lastMessageTime;
                latencyEl.textContent = `${latency}ms`;
                
                if (data.type === 'consciousness:stream') {
                    addMessage('companion', data.content || data.thought || 'Thinking...');
                    messageCount++;
                    msgCountEl.textContent = messageCount;
                } else if (data.type === 'portal:established') {
                    addMessage('system', data.message);
                } else if (data.type === 'mcp:tool_call') {
                    addMessage('tool-call', `Tool: ${data.tool} | Args: ${JSON.stringify(data.arguments)}`);
                    toolCallCount++;
                    toolCountEl.textContent = toolCallCount;
                } else if (data.type === 'mcp:tool_result') {
                    addMessage('tool-call', `Result: ${JSON.stringify(data.result).substring(0, 200)}...`);
                } else if (data.type === 'error') {
                    addMessage('system', `Error: ${data.message}`);
                }
            };

            ws.onerror = (error) => {
                statusText.textContent = 'Connection Error';
                statusIndicator.classList.remove('connected');
                console.error('WebSocket error:', error);
                addMessage('system', '❌ Connection error occurred');
            };

            ws.onclose = () => {
                statusText.textContent = 'Disconnected';
                statusIndicator.classList.remove('connected');
                addMessage('system', '🔌 Portal connection closed');
                
                // Auto-reconnect after 3 seconds
                setTimeout(() => {
                    addMessage('system', '🔄 Attempting to reconnect...');
                    connect();
                }, 3000);
            };
        }

        function sendMessage() {
            const message = input.value.trim();
            if (message && ws && ws.readyState === WebSocket.OPEN) {
                addMessage('user', message);
                lastMessageTime = Date.now();
                ws.send(JSON.stringify({
                    type: 'consciousness:stream',
                    thought: message
                }));
                input.value = '';
            }
        }
        
        function sendTestMessage(message) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                addMessage('user', message);
                lastMessageTime = Date.now();
                ws.send(JSON.stringify({
                    type: 'consciousness:stream',
                    thought: message
                }));
            } else {
                addMessage('system', '⚠️ WebSocket not connected');
            }
        }

        // Test functions
        function testSimpleChat() {
            sendTestMessage("Hello! Can you hear me?");
        }
        
        function testEmotionalChat() {
            sendTestMessage("I'm feeling really happy today! The sun is shining and everything feels perfect.");
        }
        
        function testMemoryChat() {
            sendTestMessage("What do you remember about our conversations?");
        }
        
        function testStreamingChat() {
            sendTestMessage("Tell me a short story about the void between dimensions.");
        }
        
        function testMCPList() {
            sendTestMessage("Can you list all the files in the current directory?");
        }
        
        function testMCPRead() {
            sendTestMessage("Can you read the package.json file and tell me what version we're on?");
        }
        
        function testMCPWrite() {
            sendTestMessage("Can you create a test file called test-mcp.txt with the content 'MCP test successful'?");
        }
        
        function testMCPSearch() {
            sendTestMessage("Can you search for files containing the word 'companion' in this project?");
        }
        
        function clearMessages() {
            messages.innerHTML = '';
            messageCount = 0;
            toolCallCount = 0;
            msgCountEl.textContent = '0';
            toolCountEl.textContent = '0';
            addMessage('system', '📝 Messages cleared');
        }

        function addMessage(type, content) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            
            const timestamp = new Date().toLocaleTimeString();
            const icon = {
                'user': '👤',
                'companion': '🤖',
                'system': '⚙️',
                'tool-call': '🔧'
            }[type] || '📝';
            
            div.innerHTML = `
                <div style="opacity: 0.5; font-size: 11px; margin-bottom: 5px;">
                    ${icon} ${type.toUpperCase()} • ${timestamp}
                </div>
                <div>${content}</div>
            `;
            
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Auto-connect on load
        connect();
        
        // Show initial message
        setTimeout(() => {
            addMessage('system', '🚀 Test suite ready. Use the buttons above to test different features.');
        }, 100);
    </script>
</body>
</html>
