# The Contributor License Agreement check (CLA.md): on a contributor's first
# pull request, the bot asks them to sign by comment; signatures are kept on
# the cla-signatures branch of this repository.
name: CLA
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
# Nothing by default; the one job holds only what the CLA bot uses (audit 2026-10-28 L-03).
permissions: {}
jobs:
  cla:
    # The company's own pull requests sign nothing to themselves: the export line (sync), the
    # releases (dev) and the founder's line (main) from this repository, and anything opened by
    # a member of the organisation. Everyone else signs once.
    if: >-
      !(github.event_name == 'pull_request_target'
        && github.event.pull_request.head.repo.full_name == github.repository
        && contains(fromJSON('["sync", "dev", "main"]'), github.event.pull_request.head.ref))
      && !contains(fromJSON('["OWNER", "MEMBER"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - if: github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' || github.event_name == 'pull_request_target'
        # pinned to the commit v2.6.1 names (a tag can be moved; a commit cannot). It never checks
        # out or runs the pull request's own code.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/Ignis-AI-Labs/deus-neuma/blob/main/CLA.md
          branch: cla-signatures
          allowlist: dependabot[bot]
