name: macOS build
# The Mac app, built on the chip it is for: Apple silicon on macos-15, Intel on
# macos-15-intel. One node_modules cannot serve both chips — a package that
# ships one native binary per chip installs only the host's — so each chip
# gets its own runner and its own `npm ci` (docs/architecture/platform/macos-build.md).
#
# What this does NOT do: sign the update feed. That is the release key's,
# offline, and never in CI. The maintainers' ship step downloads these
# artifacts, checks them again, signs the feed and publishes.
#
# Apple signing and notarization happen here only when the repository holds
# the Apple credentials (secrets CSC_LINK, CSC_KEY_PASSWORD, APPLE_API_KEY,
# APPLE_API_KEY_ID, APPLE_API_ISSUER). Without them the build is unsigned, and
# the artifact check says so out loud instead of failing.
# Every version the export publishes is built for the Mac as it lands on `sync` (2026-11-14: Founder,
# […]): the releases ship from `sync`, and a
# hand-started run needs the workflow on the default branch, which moves only by a release pull
# request. So the Mac files of a version are waiting by the time its Linux build is signed.
on:
  workflow_dispatch:
  push:
    branches: ['sync']
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: the desk (vite)
        run: npm run build
      - name: native modules for Electron, not Node
        run: node scripts/ensure-native-abi.mjs electron
      - name: Apple credentials, only if the repository holds them
        id: apple
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_API_KEY" ]; then
            umask 077
            printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/apple-api-key.p8"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no Apple credentials: this ${{ matrix.arch }} build is UNSIGNED and NOT notarized"
          fi
      - name: package (${{ matrix.arch }})
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.apple.outputs.signed }}
          CSC_LINK: ${{ steps.apple.outputs.signed == 'true' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ steps.apple.outputs.signed == 'true' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ steps.apple.outputs.signed == 'true' && format('{0}/apple-api-key.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ steps.apple.outputs.signed == 'true' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ steps.apple.outputs.signed == 'true' && secrets.APPLE_API_ISSUER || '' }}
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never
      - name: every binary in the bundle loads on this chip
        run: node scripts/check-mac-artifacts.mjs ${{ steps.apple.outputs.signed == 'true' && '--require-signed' || '' }}
      - name: forget the Apple key file
        if: always()
        run: rm -f "$RUNNER_TEMP/apple-api-key.p8"
      # The ship step reads this: off a Mac it cannot tell an Apple signature from the ad-hoc seal
      # electron-builder puts on every arm64 app, so the build says which one it made.
      - name: say whether Apple signed it
        run: echo "${{ steps.apple.outputs.signed == 'true' && 'apple-signed-notarized' || 'unsigned' }}" > release/signing-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
            release/signing-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 30
