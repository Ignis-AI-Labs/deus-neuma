# THE BRANCH FLOW (CONTRIBUTING.md, "How changes flow"): every change lands
# in `dev` first, and `main` moves only by a release pull request from `dev`.
# This check fails a pull request into `main` from any other branch, and a
# pull request into `dev` from `main`. It is a required check on both branches.
name: Branch flow
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
permissions: {}
jobs:
  flow:
    runs-on: ubuntu-latest
    steps:
      - name: main takes only dev; dev never takes main
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$BASE" = "main" ] && { [ "$HEAD" != "dev" ] || [ "$SAME_REPO" != "true" ]; }; then
            echo "::error::Pull requests into main come only from this repository's dev branch. Open yours into dev (see CONTRIBUTING.md)."
            exit 1
          fi
          if [ "$BASE" = "dev" ] && [ "$HEAD" = "main" ]; then
            echo "::error::dev never takes main back; main only follows dev."
            exit 1
          fi
          echo "flow ok: $HEAD -> $BASE"
