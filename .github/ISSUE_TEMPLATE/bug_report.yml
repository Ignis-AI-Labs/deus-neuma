name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: "What you did, what you expected, what happened instead." }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Neuma version, placeholder: "0.1.x, or the commit you built" }
    validations: { required: true }
  - type: dropdown
    id: os
    attributes: { label: Operating system, options: [Linux, Windows, macOS] }
    validations: { required: true }
  - type: textarea
    id: logs
    attributes: { label: Logs, description: "Help → Logs in the app menu. Remove anything private before pasting.", render: text }
