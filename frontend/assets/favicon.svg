<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 132" width="132" height="132">
  <!-- THE EMBLEM — circle inscribed in a chamfered square (LINE & CYCLE).
       Geometry: frontend/utils/emblem-geometry.js. At favicon scale the mark
       carries frame + core + still point; graduations and seed live at
       seal scale. This is the SERVED copy — vite publicDir is
       frontend/assets (dist + dev /favicon.svg); frontend/public mirrors it. -->
  <rect width="132" height="132" fill="#000000"/>
  <polygon points="1,1 119,1 131,13 131,131 13,131 1,119"
           fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="3"/>
  <circle cx="66" cy="66" r="27" fill="none" stroke="#5FE9FF" stroke-width="4"/>
  <circle cx="66" cy="66" r="6" fill="#FFFFFF"/>
</svg>
