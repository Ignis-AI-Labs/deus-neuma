[project]
name = "voice-bakeoff-snac-lm"
version = "0.1.0"
description = "Voice bake-off runner for Llama-style LMs that emit SNAC 24 kHz codes: Orpheus 3B ft and Maya1."
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.7",
    "transformers>=4.56,<5",
    "accelerate>=1.0",
    "snac>=1.2.1",
    "soundfile>=0.12",
    "numpy>=1.26",
    "huggingface_hub>=0.34",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
