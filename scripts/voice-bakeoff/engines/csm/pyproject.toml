[project]
name = "voice-bakeoff-csm"
version = "0.1.0"
description = "Voice bake-off runner: Sesame CSM-1B (transformers) and MisoTTS 8B (CSM architecture, torchtune backbone)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.8",
    "transformers>=4.55,<5",
    "accelerate",
    "safetensors",
    "huggingface_hub",
    "tokenizers",
    "torchtune==0.6.1",
    "torchao==0.13.0",
    "soundfile",
    "scipy",
    "numpy",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
